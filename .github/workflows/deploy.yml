name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main # atau 'master', sesuaikan dengan nama branch utama Anda

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Frontend & API
        run: npm run build

      - name: 🚀 Deploy ke Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}       # Contoh: ftp.domainanda.com atau IP Hostinger
          username: ${{ secrets.FTP_USERNAME }}   # Username FTP Hostinger Anda
          password: ${{ secrets.FTP_PASSWORD }}   # Password FTP Hostinger Anda
          server-dir: public_html/                # Target folder di Hostinger
          local-dir: dist/                        # Folder hasil kompilasi yang di-deploy
          dangerous-clean-slate: false            # Jangan hapus file di luar dist (agar aman)
